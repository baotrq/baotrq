name: Profile card
on:
  push:
    branches: [main]
    paths: ["card/build.py", "card/ascii.txt", ".github/workflows/card.yml"]
  schedule:
    - cron: "0 17 * * *"  # 00:00 in Ho Chi Minh City
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python card/build.py
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card/dark.svg card/light.svg
          git diff --cached --quiet || { git commit -m "card: daily refresh"; git push; }
